<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Vault</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
            padding: 22px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo h1 {
            font-size: 22px;
        }

        .logo p {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 3px;
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #dbeafe;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        main {
            width: 86%;
            max-width: 1200px;
            margin: 45px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 38px;
        }

        .hero h2 {
            font-size: 38px;
            color: #111827;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
            font-size: 16px;
        }

        .content {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .card-title-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 18px;
        }

        .card-title h3 {
            font-size: 19px;
        }

        .card-title p {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 3px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder {
            color: #a1aab8;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .list-header h3 {
            font-size: 20px;
        }

        .count {
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .refresh-btn {
            border: 1px solid #dbe2ea;
            background: white;
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            color: #475569;
            margin-left: 8px;
        }

        .refresh-btn:hover {
            background: #f8fafc;
        }

        .bookmark-list {
            display: grid;
            gap: 14px;
        }

        .bookmark {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            transition: 0.2s;
        }

        .bookmark:hover {
            border-color: #bfdbfe;
            box-shadow: 0 5px 18px rgba(37, 99, 235, 0.08);
            transform: translateY(-1px);
        }

        .bookmark-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .bookmark-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 7px;
        }

        .bookmark-url {
            color: #2563eb;
            font-size: 13px;
            text-decoration: none;
            word-break: break-all;
        }

        .bookmark-url:hover {
            text-decoration: underline;
        }

        .category {
            white-space: nowrap;
            background: #f1f5f9;
            color: #475569;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            height: fit-content;
        }

        .bookmark-bottom {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            color: #94a3b8;
            font-size: 11px;
        }

        .empty {
            text-align: center;
            padding: 55px 20px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty h4 {
            color: #475569;
            margin-bottom: 6px;
        }

        .empty p {
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 850px) {
            .content {
                grid-template-columns: 1fr;
            }

            .hero h2 {
                font-size: 30px;
            }

            header {
                padding: 18px 5%;
            }

            .api-status {
                display: none;
            }

            main {
                width: 92%;
                margin: 30px auto;
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 20px;
            }

            .bookmark-top {
                flex-direction: column;
            }

            .category {
                width: fit-content;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-icon">🔖</div>

        <div>
            <h1>Bookmark Vault</h1>
            <p>Simple URL Bookmark Service</p>
        </div>
    </div>

    <div class="api-status">
        <span class="status-dot"></span>
        API Connected
    </div>

</header>

<main>

    <section class="hero">
        <h2>Save. Organize. Access.</h2>
        <p>Keep your favorite web resources organized in one simple place.</p>
    </section>

    <div class="content">

        <div class="card">

            <div class="card-title">

                <div class="card-title-icon">
                    +
                </div>

                <div>
                    <h3>Add Bookmark</h3>
                    <p>Save a new web resource</p>
                </div>

            </div>

            <form id="bookmarkForm">

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                            type="text"
                            id="title"
                            placeholder="e.g. Spring Framework Docs"
                            maxlength="100"
                            required
                    >

                </div>

                <div class="form-group">

                    <label for="url">
                        URL
                    </label>

                    <input
                            type="url"
                            id="url"
                            placeholder="https://example.com"
                            required
                    >

                </div>

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                            type="text"
                            id="category"
                            placeholder="e.g. Development"
                            required
                    >

                </div>

                <button
                        type="submit"
                        class="submit-btn"
                        id="submitBtn"
                >
                    Save Bookmark
                </button>

            </form>

            <div id="message" class="message"></div>

        </div>

        <div class="card">

            <div class="list-header">

                <div>
                    <h3>My Bookmarks</h3>
                </div>

                <div>

                    <span
                            class="count"
                            id="bookmarkCount"
                    >
                        0 bookmarks
                    </span>

                    <button
                            class="refresh-btn"
                            onclick="loadBookmarks()"
                    >
                        ↻ Refresh
                    </button>

                </div>

            </div>

            <div
                    id="bookmarkList"
                    class="bookmark-list"
            >

                <div class="loading">
                    Loading bookmarks...
                </div>

            </div>

        </div>

    </div>

</main>

<footer>
    Bookmark Vault &nbsp;•&nbsp; Spring Boot REST API
</footer>

<script>

    const API_URL = "http://localhost:8080/api/v1/bookmarks";

    async function loadBookmarks() {

        const list = document.getElementById("bookmarkList");
        const count = document.getElementById("bookmarkCount");

        list.innerHTML = `
            <div class="loading">
                Loading bookmarks...
            </div>
        `;

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Failed to load bookmarks");
            }

            const bookmarks = await response.json();

            count.textContent =
                `${bookmarks.length} ${bookmarks.length === 1 ? "bookmark" : "bookmarks"}`;

            if (bookmarks.length === 0) {

                list.innerHTML = `
                    <div class="empty">

                        <div class="empty-icon">
                            🔖
                        </div>

                        <h4>No bookmarks yet</h4>

                        <p>
                            Add your first bookmark using the form.
                        </p>

                    </div>
                `;

                return;
            }

            list.innerHTML = bookmarks.map(bookmark => {

                const date = bookmark.createdAt
                    ? new Date(bookmark.createdAt).toLocaleString()
                    : "Date unavailable";

                return `
                    <div class="bookmark">

                        <div class="bookmark-top">

                            <div>

                                <div class="bookmark-title">
                                    ${escapeHtml(bookmark.title)}
                                </div>

                                <a
                                    class="bookmark-url"
                                    href="${escapeAttribute(bookmark.url)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    ${escapeHtml(bookmark.url)}
                                </a>

                            </div>

                            <span class="category">
                                ${escapeHtml(bookmark.category)}
                            </span>

                        </div>

                        <div class="bookmark-bottom">
                            Added ${date}
                        </div>

                    </div>
                `;

            }).join("");

        } catch (error) {

            count.textContent = "0 bookmarks";

            list.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h4>Unable to connect</h4>

                    <p>
                        Make sure your Spring Boot application is running on port 8080.
                    </p>

                </div>
            `;
        }
    }

    document
        .getElementById("bookmarkForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const title =
                document.getElementById("title").value.trim();

            const url =
                document.getElementById("url").value.trim();

            const category =
                document.getElementById("category").value.trim();

            const button =
                document.getElementById("submitBtn");

            const message =
                document.getElementById("message");

            button.disabled = true;
            button.textContent = "Saving...";

            message.className = "message";
            message.textContent = "";

            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title: title,
                        url: url,
                        category: category
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    let errorMessage = "Unable to save bookmark.";

                    if (data.errors && data.errors.length > 0) {
                        errorMessage = data.errors.join(", ");
                    }

                    throw new Error(errorMessage);
                }

                message.className = "message success";
                message.textContent = "✓ Bookmark saved successfully!";

                document
                    .getElementById("bookmarkForm")
                    .reset();

                await loadBookmarks();

            } catch (error) {

                message.className = "message error";
                message.textContent = "✕ " + error.message;

            } finally {

                button.disabled = false;
                button.textContent = "Save Bookmark";

            }

        });

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {

        return String(value)
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadBookmarks();

</script>

</body>
</html>
